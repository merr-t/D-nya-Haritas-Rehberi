<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dünya Haritası Rehberi</title>
<style>
:root{--sea:#cfe3f3;--land:#8fb4d6;--hov:#e8a33d;--sel:#d9534f;--panel:#fff;--tx:#1b2430;--mut:#5b6877;--chip:#eaf1f8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sea:#0f1c2b;--land:#3f6489;--hov:#d18a22;--sel:#e0605c;--panel:#18232f;--tx:#e7edf3;--mut:#9db0c3;--chip:#243545}}
:root[data-theme="dark"]{--sea:#0f1c2b;--land:#3f6489;--hov:#d18a22;--sel:#e0605c;--panel:#18232f;--tx:#e7edf3;--mut:#9db0c3;--chip:#243545}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--sea);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx)}
#app{display:flex;height:100%}
#side{display:none;width:380px;flex:none;background:var(--panel);overflow:auto;padding:22px 20px;box-shadow:2px 0 14px rgba(0,0,0,.18);z-index:5}#side.open{display:block}
#x{position:sticky;top:0;float:right;width:32px;height:32px;border:0;border-radius:50%;background:var(--chip);color:var(--tx);font-size:20px;line-height:1;cursor:pointer;z-index:6}
#hint{position:absolute;top:68px;left:50%;transform:translateX(-50%);background:var(--panel);color:var(--tx);padding:8px 18px;border-radius:999px;box-shadow:0 2px 10px rgba(0,0,0,.25);font-size:.9rem;z-index:3;pointer-events:none;white-space:nowrap}
#stage{position:relative;flex:1;min-width:0;min-height:0;overflow:hidden}
#map{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
h1{font-size:1.5rem;margin:0 0 4px}
.flag{font-size:2.4rem;line-height:1;min-height:32px}
.flag img{height:36px;width:auto;max-width:100%;border-radius:4px;box-shadow:0 1px 5px rgba(0,0,0,.35);display:block}
h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:20px 0 8px}
p{color:var(--mut);line-height:1.5;margin:6px 0}
ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
li{background:var(--chip);border-radius:999px;padding:6px 12px;font-size:.9rem}
a{color:var(--hov)}
.car{position:relative}
.fact{background:var(--chip);border-radius:12px;padding:6px 14px}.fact p{margin:7px 0;color:var(--tx);font-size:.92rem;line-height:1.5}
.inf{color:var(--tx);font-size:.92rem;line-height:1.6;margin:0 0 6px}.more{font-size:.85rem}
.ph{background-size:200% 200%;animation:sh 3s ease infinite}@keyframes sh{50%{background-position:100% 100%}}
.trk{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.trk::-webkit-scrollbar{display:none}
.card{flex:0 0 80%;scroll-snap-align:start;background:var(--chip);border-radius:12px;overflow:hidden;color:inherit;text-decoration:none;display:flex;flex-direction:column}
.ph{height:150px;display:grid;place-items:center;font-size:2.4rem;background:linear-gradient(135deg,var(--land),var(--hov))}
.ph img{width:100%;height:100%;object-fit:cover}
.tx{padding:10px 12px}.tx b{display:block;margin-bottom:4px}.tx span{display:block;font-size:.8rem;color:var(--mut);line-height:1.4}
.nv{position:absolute;top:60px;z-index:2;width:30px;height:30px;border-radius:50%;border:0;background:var(--panel);color:var(--tx);box-shadow:0 1px 5px rgba(0,0,0,.4);cursor:pointer;font-size:18px;line-height:1}
.nv.l{left:4px}.nv.r{right:4px}
.jvm-container{position:relative;overflow:hidden;width:100%;height:100%;touch-action:none}
.jvm-container svg{display:block}
.jvm-region{fill:var(--land);stroke:var(--panel);stroke-width:.5;cursor:pointer;transition:filter .15s}
.jvm-region:hover{filter:brightness(1.2) saturate(1.1);stroke:var(--hov);stroke-width:1.2}
.jvm-region.sel{stroke:var(--sel);stroke-width:2.2}
.jvm-zoom-btn{position:absolute;left:12px;width:32px;height:32px;line-height:30px;text-align:center;border-radius:6px;background:var(--panel);color:var(--tx);font-size:20px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.3);user-select:none}
.jvm-zoomin{top:12px}.jvm-zoomout{top:52px}
.jvm-tooltip{position:absolute;display:none;padding:4px 9px;background:#111;color:#fff;border-radius:5px;font-size:13px;pointer-events:none;white-space:nowrap;z-index:20}
.jvm-tooltip.active{display:block}
/* Arama menüsü */
#search{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:min(420px,calc(100% - 28px));z-index:10}
.sbar{position:relative}
#q{width:100%;box-sizing:border-box;padding:11px 40px 11px 42px;border-radius:999px;border:0;background:var(--panel);color:var(--tx);font:inherit;font-size:1rem;box-shadow:0 2px 12px rgba(0,0,0,.28);outline:none}
#q:focus{box-shadow:0 2px 12px rgba(0,0,0,.28),0 0 0 2px var(--hov)}
#q::placeholder{color:var(--mut)}
.sico{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:18px;height:18px;pointer-events:none;color:var(--mut)}
#qc{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:26px;height:26px;border:0;border-radius:50%;background:var(--chip);color:var(--tx);font-size:16px;line-height:1;cursor:pointer;display:none}
#search.has #qc{display:block}
#res{display:none;position:relative;margin-top:6px;padding:6px;background:var(--panel);border-radius:16px;box-shadow:0 6px 20px rgba(0,0,0,.3);max-height:min(50vh,340px);overflow:auto;overscroll-behavior:contain}
#res.open{display:block}
.opt{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer;font-size:.95rem}
.opt.on,.opt:hover{background:var(--chip)}
.opt img{width:26px;height:18px;object-fit:cover;border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.2);flex:none}
.opt small{margin-left:auto;color:var(--mut);font-size:.75rem}
.none{padding:10px;color:var(--mut);font-size:.9rem}
@media (max-width:700px){#app{flex-direction:column-reverse}#side{width:auto;height:45%;flex:none;box-shadow:0 -2px 14px rgba(0,0,0,.2)}}
</style>
</head>
<body>
<div id="app">
  <aside id="side"><button id="x" aria-label="Kapat">×</button><div id="panel"></div></aside>
  <div id="stage">
    <div id="search" role="search">
      <div class="sbar">
        <svg class="sico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="text" autocomplete="off" spellcheck="false" placeholder="Ülke ara…" aria-label="Ülke ara" role="combobox" aria-expanded="false" aria-controls="res">
        <button id="qc" aria-label="Aramayı temizle">×</button>
      </div>
      <div id="res" role="listbox"></div>
    </div>
    <div id="hint">Bir ülkeye tıklayın veya arayın</div>
    <div id="map"></div>
  </div>
</div>

function sum(c){
  const w=document.createElement('div'),f=F[c];
  w.innerHTML='<h2>Kısaca</h2><div class="fact"></div>';
  const b=w.querySelector('.fact');
  if(f){const [k,y,g]=f.split('|');b.innerHTML='<p><b>Başkent:</b> '+k+'</p><p><b>Ünlü yemek:</b> '+y+'</p><p><b>Önemli gün:</b> '+g+'</p>';return w}
  fetch('https://restcountries.com/v3.1/alpha/'+c+'?fields=capital,population,languages,currencies').then(r=>r.json()).then(j=>{
    j=Array.isArray(j)?j[0]:j;
    const L=Object.entries(j.languages||{}).map(([k,v])=>{try{return new Intl.DisplayNames(['tr'],{type:'language'}).of(k)}catch(e){return v}});
    const M=Object.keys(j.currencies||{}).map(k=>{try{return new Intl.DisplayNames(['tr'],{type:'currency'}).of(k)}catch(e){return k}});
    let h='';
    if(j.capital&&j.capital.length)h+='<p><b>Başkent:</b> '+j.capital.join(', ')+'</p>';
    if(j.population)h+='<p><b>Nüfus:</b> yaklaşık '+(j.population/1e6).toFixed(1)+' milyon</p>';
    if(L.length)h+='<p><b>Dil:</b> '+L.join(', ')+'</p>';
    if(M.length)h+='<p><b>Para birimi:</b> '+M.join(', ')+'</p>';
    if(h)b.innerHTML=h;else w.remove();
  }).catch(()=>w.remove());
  return w;
}
const dn=new Intl.DisplayNames(['tr'],{type:'region'});
const nm=c=>{try{return dn.of(c)}catch(e){return c}};
const flag=c=>/^[A-Z]{2}$/.test(c)?String.fromCodePoint(...[...c].map(x=>127397+x.charCodeAt(0))):'🌍';
// Bayrak görselleri: flagcdn.com (ISO 3166-1 alpha-2 koduna göre)
const flagUrl=(c,w)=>'https://flagcdn.com/w'+(w||320)+'/'+c.toLowerCase()+'.png';
const isCode=c=>/^[A-Z]{2}$/.test(c||'');
function flagEl(c){
  const d=document.createElement('div');d.className='flag';
  if(!isCode(c)){d.textContent='🌍';return d}
  const im=new Image();im.alt='';im.src=flagUrl(c,160);
  im.onerror=()=>{d.textContent=flag(c)};
  d.appendChild(im);return d;
}
const li=s=>'<ul>'+s.split(';').map(x=>'<li>'+x+'</li>').join('')+'</ul>';
const panel=document.getElementById('panel'),side=document.getElementById('side');
function home(){
  panel.innerHTML='<div class="flag">🌍</div><h1>Dünya Haritası Rehberi</h1><p>Haritada bir ülkeye tıklayın ya da yukarıdaki kutudan arayın; gezilecek yerler, tarihi mekânlar ve önemli şahsiyetler fotoğraflı kartlar olarak burada yan yana kayar.</p><p>Her ülke kendi bayrağıyla gösterilir.</p>';
}
const cache={};
function wiki(q,lim,s){
  s=s||2;const k=q+'|'+lim+'|'+s;
  return cache[k]||(cache[k]=fetch('https://tr.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrlimit='+lim+'&gsrsearch='+encodeURIComponent(q)+'&prop=pageimages|extracts&piprop=thumbnail&pithumbsize=520&exintro=1&explaintext=1&exsentences='+s+'&exlimit=max')
    .then(r=>r.json()).then(j=>Object.values((j.query||{}).pages||{}).sort((a,b)=>a.index-b.index))
    .catch(()=>{delete cache[k];return[]}));
}
function mk(title,ico){
  const a=document.createElement('a');a.className='card';a.target='_blank';a.rel='noopener';
  a.innerHTML='<div class="ph"></div><div class="tx"><b></b><span></span></div>';
  a.querySelector('b').textContent=title;return a;
}
function fill(a,pg){
  if(!pg)return;
  a.href='https://tr.wikipedia.org/?curid='+pg.pageid;
  a.querySelector('span').textContent=pg.extract||'';
  if(pg.thumbnail){const im=new Image();im.alt=pg.title;im.onload=()=>{const ph=a.querySelector('.ph');ph.textContent='';ph.appendChild(im)};im.src=pg.thumbnail.source}
}
function car(h,cards){
  const w=document.createElement('div');
  w.innerHTML='<h2></h2><div class="car"><button class="nv l" aria-label="Geri">‹</button><div class="trk"></div><button class="nv r" aria-label="İleri">›</button></div>';
  w.querySelector('h2').textContent=h;
  const t=w.querySelector('.trk');cards.forEach(c=>t.appendChild(c));
  w.querySelector('.l').onclick=()=>t.scrollBy({left:-t.clientWidth*.8,behavior:'smooth'});
  w.querySelector('.r').onclick=()=>t.scrollBy({left:t.clientWidth*.8,behavior:'smooth'});
  return w;
}
function items(h,list,ico,n){
  return car(h,list.split(';').map(x=>{
    const c=mk(x,ico),q=x.replace(/\s*\(.*\)/,'');
    c.href='https://tr.wikipedia.org/w/index.php?search='+encodeURIComponent(q);
    wiki(q+' '+n,3).then(r=>r.find(p=>p.thumbnail)||wiki(q,3).then(r2=>r2.find(p=>p.thumbnail)||r[0]||r2[0])).then(pg=>fill(c,pg));
    return c;
  }));
}
function auto(h,q,lim,ico){
  const w=car(h,[]),t=w.querySelector('.trk');
  wiki(q,lim).then(r=>{if(!r.length){w.remove();return}r.forEach(pg=>{const c=mk(pg.title,ico);fill(c,pg);t.appendChild(c)})});
  return w;
}
function info(h,q,s){
  const w=document.createElement('div');
  w.innerHTML='<h2></h2><p class="inf"></p><a class="more" target="_blank" rel="noopener">Vikipedi\'de devamını oku →</a>';
  w.querySelector('h2').textContent=h;
  wiki(q,1,s).then(r=>{const pg=r[0];if(!pg||!pg.extract){w.remove();return}w.querySelector('.inf').textContent=pg.extract;w.querySelector('.more').href='https://tr.wikipedia.org/?curid='+pg.pageid});
  return w;
}
function show(code){
  const hh=document.getElementById('hint');if(hh)hh.remove();
  document.querySelectorAll('#map .sel').forEach(e=>e.classList.remove('sel'));
  const p=(typeof NODES!=='undefined'&&NODES[code])||null;
  if(p)p.classList.add('sel');
  const n=nm(code),d=D[code];
  panel.innerHTML='';
  panel.append(flagEl(code));
  const h1=document.createElement('h1');h1.textContent=n;panel.append(h1);
  panel.append(sum(code));
  if(d){
    const [a,b]=d.split('|');
    panel.append(items('Gezilecek & tarihi yerler',a,'📍',n),items('Önemli şahsiyetler',b,'👤',n));
  }else{
    const q=document.createElement('p');q.textContent="Bu ülke için hazır liste yok; içerik Vikipedi'den otomatik getiriliyor.";
    panel.append(q,auto('Ülke hakkında',n,1,'🌍'),auto('Gezilecek yerler',n+' turistik yerler',6,'📍'));
  }
  panel.append(info('Ülke hakkında',n,7),info('Tarihçe',n+' tarihi',6),info('Coğrafya ve doğa',n+' coğrafyası',5));
  side.scrollTop=0;side.classList.add('open');
}
const stage=document.getElementById('stage'),mapEl=document.getElementById('map');
const R=900/440.7;let M; // dünya haritasının en-boy oranı (kütüphane harita verisini dışarı açmaz)
function fit(){
  const W=stage.clientWidth,H=stage.clientHeight;if(!W||!H)return;
  let w=W,h=W/R;if(h>H){h=H;w=H*R}
  mapEl.style.width=w+'px';mapEl.style.height=h+'px';
  mapEl.style.transform='translate(-50%,-50%) scale('+Math.min(W/w,1.4)+','+Math.min(H/h,1.4)+')';
  if(M&&M.container&&M.canvas){try{M.updateSize()}catch(e){}}
}
fit();
M=new jsVectorMap({
  selector:'#map',map:'world',backgroundColor:'transparent',
  zoomButtons:false,zoomOnScroll:false,zoomMin:1,zoomMax:1,showTooltip:true,
  onRegionTooltipShow(e,t,code){t.text(nm(code))},
  onRegionClick(e,code){show(code)}
});
new ResizeObserver(fit).observe(stage);
document.getElementById('x').onclick=()=>{side.classList.remove('open');document.querySelectorAll('#map .sel').forEach(e=>e.classList.remove('sel'))};

/* ---------- Ülke yollarını haritanın kendi DOM'undan al ---------- */
const NODES={};
function collectNodes(){
  mapEl.querySelectorAll('path[data-code]').forEach(p=>{
    const c=p.getAttribute('data-code');
    if(isCode(c)){NODES[c]=p;p.classList.add('jvm-region')}
  });
}

/* ---------- Bayrakları ülke sınırlarının içine yerleştir ---------- */
function loadFlag(c,w,cb){
  const u=['https://flagcdn.com/w'+w+'/'+c.toLowerCase()+'.png','https://flagsapi.com/'+c+'/flat/64.png'];
  let i=0;const im=new Image();
  im.onload=()=>cb(im.src);
  im.onerror=()=>{i++;if(i<u.length)im.src=u[i];else cb(null)};
  im.src=u[0];
}
function applyFlags(){
  const svg=mapEl.querySelector('svg');if(!svg)return;
  const NS='http://www.w3.org/2000/svg',XL='http://www.w3.org/1999/xlink';
  const holder=document.createElementNS(NS,'svg');
  holder.setAttribute('aria-hidden','true');
  holder.style.cssText='position:absolute;width:0;height:0;overflow:hidden;pointer-events:none';
  const defs=document.createElementNS(NS,'defs');
  holder.appendChild(defs);document.body.appendChild(holder);
  let css='';
  Object.keys(NODES).forEach(c=>{
    if(!isCode(c))return;
    const p=NODES[c];let b;
    try{b=p.getBBox()}catch(e){return}
    if(!b||!b.width||!b.height)return;
    const id='fl-'+c,pt=document.createElementNS(NS,'pattern');
    // Desen karosu ülkenin sınır kutusuna oturur; içerik kendi sol-üst köşesinden (0,0) başlar
    pt.setAttribute('id',id);pt.setAttribute('patternUnits','userSpaceOnUse');
    pt.setAttribute('x',b.x);pt.setAttribute('y',b.y);pt.setAttribute('width',b.width);pt.setAttribute('height',b.height);
    // Bayrak gelene kadar (veya hiç gelmezse) arkada düz kara rengi görünsün
    const bg=document.createElementNS(NS,'rect');
    bg.setAttribute('x',0);bg.setAttribute('y',0);bg.setAttribute('width',b.width);bg.setAttribute('height',b.height);
    bg.setAttribute('style','fill:var(--land)');
    const im=document.createElementNS(NS,'image');
    im.setAttribute('x',0);im.setAttribute('y',0);im.setAttribute('width',b.width);im.setAttribute('height',b.height);
    im.setAttribute('preserveAspectRatio','xMidYMid slice');
    pt.appendChild(bg);pt.appendChild(im);defs.appendChild(pt);
    p.setAttribute('data-flag',c);
    css+='[data-flag="'+c+'"]{fill:url(#'+id+')!important}\n';
    loadFlag(c,320,src=>{if(src){im.setAttribute('href',src);im.setAttributeNS(XL,'xlink:href',src)}});
  });
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
}

/* ---------- Arama menüsü ---------- */
const q=document.getElementById('q'),res=document.getElementById('res'),sbox=document.getElementById('search'),qc=document.getElementById('qc');
const norm=s=>(s||'').toLocaleLowerCase('tr').replace(/ı/g,'i').normalize('NFD').replace(/[̀-ͯ]/g,'');
const dnEn=new Intl.DisplayNames(['en'],{type:'region'});
// Ülke listesi doğrudan harita verisinden gelir (DOM öznitelikleri olmasa da çalışır)
let LIST=[];
function buildList(){LIST=Object.keys(NODES).filter(isCode).map(c=>{
  const n=nm(c);let e='';try{e=dnEn.of(c)}catch(_){}
  return{c,n,k:norm(n),e:norm(e),cc:c.toLowerCase()};
}).sort((a,b)=>a.n.localeCompare(b.n,'tr'))}
let cur=[],idx=-1;
function render(){
  const t=norm(q.value.trim());
  if(!t)cur=LIST.slice();
  else{
    const a=[],b=[];
    LIST.forEach(o=>{
      if(o.k.startsWith(t)||o.e.startsWith(t)||o.cc===t)a.push(o);
      else if(o.k.includes(t)||o.e.includes(t))b.push(o);
    });
    cur=a.concat(b);
  }
  idx=cur.length&&t?0:-1;
  res.innerHTML='';
  if(!cur.length){const d=document.createElement('div');d.className='none';d.textContent='Sonuç bulunamadı';res.appendChild(d)}
  cur.forEach(o=>{
    const d=document.createElement('div');d.className='opt';d.setAttribute('role','option');
    const im=new Image();im.alt='';im.loading='lazy';im.src=flagUrl(o.c,40);
    im.onerror=()=>{im.remove()};
    const s=document.createElement('span');s.textContent=o.n;
    const sm=document.createElement('small');sm.textContent=o.c;
    d.append(im,s,sm);
    d.addEventListener('mousedown',e=>e.preventDefault());
    d.addEventListener('click',()=>pick(o.c));
    res.appendChild(d);
  });
  res.scrollTop=0;
  mark();
}
function mark(){
  const opts=res.querySelectorAll('.opt');
  opts.forEach((e,i)=>e.classList.toggle('on',i===idx));
  const on=opts[idx];
  if(on){
    const t=on.offsetTop,b=t+on.offsetHeight;
    if(t<res.scrollTop)res.scrollTop=Math.max(0,t-6);
    else if(b>res.scrollTop+res.clientHeight)res.scrollTop=b-res.clientHeight+6;
  }
}
function isOpen(){return res.classList.contains('open')}
function openRes(){render();res.classList.add('open');q.setAttribute('aria-expanded','true')}
function closeRes(){res.classList.remove('open');q.setAttribute('aria-expanded','false')}
function pick(c){
  q.value=nm(c);sbox.classList.add('has');closeRes();q.blur();show(c);
}
q.addEventListener('focus',openRes);
q.addEventListener('click',()=>{if(!isOpen())openRes()});
q.addEventListener('input',()=>{sbox.classList.toggle('has',!!q.value);openRes()});
q.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){e.preventDefault();if(!isOpen())openRes();if(cur.length){idx=(idx+1)%cur.length;mark()}}
  else if(e.key==='ArrowUp'){e.preventDefault();if(!isOpen())openRes();if(cur.length){idx=(idx-1+cur.length)%cur.length;mark()}}
  else if(e.key==='Enter'){e.preventDefault();const o=idx>=0?cur[idx]:null;if(o)pick(o.c)}
  else if(e.key==='Escape'){closeRes();q.blur()}
});
qc.addEventListener('click',()=>{q.value='';sbox.classList.remove('has');q.focus();openRes()});
document.addEventListener('mousedown',e=>{if(!e.target.closest('#search'))closeRes()});
document.addEventListener('touchstart',e=>{if(!e.target.closest('#search'))closeRes()},{passive:true});

/* ---------- Harita hazır olunca çalıştır ----------
   jsvectormap, sayfa hâlâ yükleniyorsa kurulumunu DOMContentLoaded'a erteler;
   ülke yolları, bayraklar ve arama listesi ancak bundan sonra oluşturulabilir. */
let booted=false;
function boot(){
  if(booted||!(M&&M.container&&M.canvas))return false;
  booted=true;
  collectNodes();
  try{applyFlags()}catch(err){console.error('bayraklar yerleştirilemedi',err)}
  buildList();
  fit();
  return true;
}
if(!boot()){
  window.addEventListener('DOMContentLoaded',()=>{if(!boot()){const t=setInterval(()=>{if(boot())clearInterval(t)},30)}});
}
</script>
